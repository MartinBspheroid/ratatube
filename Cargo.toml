[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# One version table for the whole workspace so the crate split cannot drift.
[workspace.dependencies]
ratatube-domain = { path = "crates/ratatube-domain" }
ratatube-protocol = { path = "crates/ratatube-protocol" }

chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.32"
image = "0.25.10"
rand = "0.10.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["image-defaults", "crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "process", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", features = ["serde"] }
unicode-width = "0.2.2"
which = "8.0.5"

tempfile = "3.27.0"
