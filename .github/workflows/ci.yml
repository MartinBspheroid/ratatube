name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Deterministic and adapter tests
        run: cargo test --locked --all-targets
      - name: Explain external integration policy
        run: echo 'Live-network yt-dlp tests are ignored by default; the real mpv test reports an explicit prerequisite skip.'
